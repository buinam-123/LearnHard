<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #111111;
      --muted: #666666;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      overflow: hidden;
      user-select: none;
    }
    .card {
      background: var(--card);
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 420px;
      transition: background 0.3s;
    }
    button {
      padding: 12px 28px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.95); }
    #message {
      margin: 24px 0 8px;
      font-size: 32px;
      font-weight: bold;
      min-height: 1.3em;
    }
    #message.pop { animation: pop 0.4s ease; }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    #lang { color: var(--muted); font-size: 14px; min-height: 1.2em; margin: 0; }
    #counter { color: var(--muted); margin: 20px 0 4px; font-size: 14px; }
    #score { font-weight: 600; margin: 12px 0 4px; font-size: 16px; }
    #score.bump { animation: pop 0.3s ease; }
    .hint { color: var(--muted); font-size: 13px; margin: 0; }

    .toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }
    .toolbar button {
      padding: 8px 12px;
      font-size: 18px;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .palette {
      position: fixed;
      top: 64px;
      right: 16px;
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      display: none;
      grid-template-columns: repeat(4, 32px);
      gap: 8px;
      z-index: 20;
    }
    .palette.open { display: grid; }
    .swatch {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.15);
      cursor: pointer;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.default {
      background: var(--card);
      color: var(--text);
      font-size: 14px;
    }
    .palette input[type="color"] {
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: none;
      cursor: pointer;
    }

    .animal {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 10;
    }
    .animal.catchable { pointer-events: auto; cursor: crosshair; }
    .animal span {
      display: inline-block;
      animation: hop 0.35s ease-in-out infinite alternate;
    }
    @keyframes hop {
      from { transform: translateY(0) rotate(-8deg); }
      to { transform: translateY(-14px) rotate(8deg); }
    }
    .points {
      position: fixed;
      pointer-events: none;
      font-weight: bold;
      font-size: 22px;
      color: #10b981;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      transform: translate(-50%, -50%);
      animation: floatUp 0.9s ease-out forwards;
      z-index: 30;
    }
    .points.rare { color: #f59e0b; font-size: 30px; }
    @keyframes floatUp {
      to { transform: translate(-50%, -150%); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="soundBtn" title="Bật/tắt âm thanh">🔊</button>
    <button id="paletteBtn" title="Đổi màu nền">🎨</button>
    <button id="theme" title="Đổi giao diện sáng/tối">🌙</button>
  </div>
  <div class="palette" id="palette"></div>

  <div class="card">
    <button id="btn">Click me</button>
    <p id="message"></p>
    <p id="lang"></p>
    <p id="counter">Bạn đã bấm 0 lần</p>
    <p id="score">🎯 Điểm: 0 · 🏆 Kỷ lục: 0</p>
    <p class="hint">Bấm vào thú đang chạy để bắt! 🦄 🦖 hiếm được +5</p>
  </div>

  <script>
    // ---------- Lưu trữ (an toàn nếu trình duyệt chặn localStorage) ----------
    function load(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, value); } catch {}
    }

    // ---------- Dữ liệu ----------
    const greetings = [
      ["Hello World", "Tiếng Anh"],
      ["Xin chào Thế giới", "Tiếng Việt"],
      ["Bonjour le monde", "Tiếng Pháp"],
      ["Hola Mundo", "Tiếng Tây Ban Nha"],
      ["こんにちは世界", "Tiếng Nhật"],
      ["안녕하세요 세계", "Tiếng Hàn"],
      ["你好，世界", "Tiếng Trung"],
      ["Hallo Welt", "Tiếng Đức"],
      ["Ciao Mondo", "Tiếng Ý"],
      ["Привет, мир", "Tiếng Nga"]
    ];
    const colors = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899"];

    // Mỗi con vật gắn với một kiểu tiếng kêu
    const animalSounds = {
      bark:   ["🐶", "🐕", "🦊"],
      meow:   ["🐱", "🐈"],
      roar:   ["🦁", "🐯", "🐅", "🐆", "🐻", "🐼", "🦍", "🦖", "🐊"],
      chirp:  ["🐔", "🐓", "🐧", "🐤", "🦉", "🦩"],
      quack:  ["🦆", "🐸"],
      moo:    ["🐮", "🐄", "🦬", "🐘"],
      squeak: ["🐭", "🐁", "🐹", "🐰", "🐇", "🐿️", "🦔", "🦦"],
      neigh:  ["🐴", "🐎", "🦄", "🦓", "🦒", "🐫", "🦙", "🦌", "🦘"],
      oink:   ["🐷", "🐖"],
      boing:  ["🐨", "🐵", "🐢", "🐍", "🦥"]
    };
    const soundOf = {};
    for (const [type, list] of Object.entries(animalSounds)) {
      list.forEach((a) => (soundOf[a] = type));
    }
    const animals = Object.keys(soundOf);
    const rareAnimals = ["🦄", "🦖"];

    // ---------- Phần tử ----------
    const btn = document.getElementById("btn");
    const message = document.getElementById("message");
    const lang = document.getElementById("lang");
    const counter = document.getElementById("counter");
    const scoreEl = document.getElementById("score");
    const themeBtn = document.getElementById("theme");
    const soundBtn = document.getElementById("soundBtn");
    const palette = document.getElementById("palette");
    const paletteBtn = document.getElementById("paletteBtn");

    let count = 0;
    let score = 0;
    let best = Number(load("best", 0)) || 0;
    let muted = load("muted", "0") === "1";

    // ---------- Âm thanh tổng hợp bằng Web Audio (không cần file) ----------
    let audioCtx = null;
    function ctx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    // Phát một nốt có tần số thay đổi theo các điểm trong `freqs`
    function tone(freqs, dur, wave = "sine", at = 0, vol = 0.15, filter = 0) {
      const ac = ctx();
      const t0 = ac.currentTime + at;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freqs[0], t0);
      freqs.slice(1).forEach((f, i) => {
        osc.frequency.linearRampToValueAtTime(f, t0 + (dur * (i + 1)) / (freqs.length - 1));
      });
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      let node = osc;
      if (filter) {
        const f = ac.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.value = filter;
        osc.connect(f);
        node = f;
      }
      node.connect(gain).connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }

    const voices = {
      bark:   (at) => { tone([320, 160], 0.09, "square", at, 0.12, 1200); tone([320, 160], 0.09, "square", at + 0.16, 0.12, 1200); },
      meow:   (at) => tone([480, 820, 420], 0.55, "triangle", at, 0.15),
      roar:   (at) => tone([140, 110, 70], 0.7, "sawtooth", at, 0.18, 500),
      chirp:  (at) => { for (let i = 0; i < 3; i++) tone([2000, 3000], 0.06, "sine", at + i * 0.09, 0.08); },
      quack:  (at) => { tone([620, 420], 0.14, "sawtooth", at, 0.1, 1500); tone([620, 420], 0.14, "sawtooth", at + 0.2, 0.1, 1500); },
      moo:    (at) => tone([160, 130, 100], 0.9, "sawtooth", at, 0.16, 400),
      squeak: (at) => { tone([3000, 3600], 0.05, "sine", at, 0.08); tone([3200, 3800], 0.05, "sine", at + 0.08, 0.08); },
      neigh:  (at) => tone([600, 1100, 850, 1100, 500], 0.7, "triangle", at, 0.12),
      oink:   (at) => { tone([260, 180], 0.12, "square", at, 0.1, 800); tone([260, 180], 0.12, "square", at + 0.16, 0.1, 800); },
      boing:  (at) => tone([200, 650], 0.25, "sine", at, 0.15)
    };

    function playAnimal(emoji, at = 0) {
      if (muted) return;
      try { voices[soundOf[emoji] || "boing"](at); } catch {}
    }
    function playCatch(rare) {
      if (muted) return;
      try {
        tone([880, 1320], 0.12, "sine", 0, 0.12);
        if (rare) tone([1320, 1760], 0.15, "sine", 0.12, 0.12);
      } catch {}
    }

    function updateSoundBtn() { soundBtn.textContent = muted ? "🔇" : "🔊"; }
    soundBtn.addEventListener("click", () => {
      muted = !muted;
      save("muted", muted ? "1" : "0");
      updateSoundBtn();
    });

    // ---------- Nút Click me ----------
    btn.addEventListener("click", () => {
      count++;
      const [text, language] = count === 1
        ? greetings[0]
        : greetings[Math.floor(Math.random() * greetings.length)];

      message.textContent = text;
      message.style.color = colors[Math.floor(Math.random() * colors.length)];
      lang.textContent = language;
      message.classList.remove("pop");
      void message.offsetWidth;
      message.classList.add("pop");

      counter.textContent = `Bạn đã bấm ${count} lần`;
      if (count % 10 === 0) counter.textContent += " 🎉 Thật kiên trì!";

      releaseAnimals();
    });

    // ---------- Bầy động vật ----------
    function releaseAnimals() {
      const rect = btn.getBoundingClientRect();
      const startX = rect.left + rect.width / 2;
      const startY = rect.top + rect.height / 2;
      const total = 12 + Math.floor(Math.random() * 6);
      const maxDist = Math.hypot(window.innerWidth, window.innerHeight);
      const herd = [];

      for (let i = 0; i < total; i++) {
        const emoji = animals[Math.floor(Math.random() * animals.length)];
        herd.push(emoji);

        const wrap = document.createElement("div");
        wrap.className = "animal";
        const inner = document.createElement("span");
        inner.textContent = emoji;
        inner.style.fontSize = 28 + Math.random() * 28 + "px";
        inner.style.animationDuration = 0.2 + Math.random() * 0.25 + "s";
        wrap.appendChild(inner);
        document.body.appendChild(wrap);

        const angle = Math.random() * Math.PI * 2;
        const endX = startX + Math.cos(angle) * maxDist;
        const endY = startY + Math.sin(angle) * maxDist;
        const flip = Math.cos(angle) > 0 ? -1 : 1;
        const duration = 1800 + Math.random() * 1800;

        const anim = wrap.animate(
          [
            { transform: `translate(${startX}px, ${startY}px) translate(-50%, -50%) scale(0.3) scaleX(${flip})` },
            { transform: `translate(${startX}px, ${startY}px) translate(-50%, -50%) scale(1) scaleX(${flip})`, offset: 0.08 },
            { transform: `translate(${endX}px, ${endY}px) translate(-50%, -50%) scale(1) scaleX(${flip})` }
          ],
          { duration, delay: Math.random() * 300, easing: "ease-in", fill: "both" }
        );
        anim.onfinish = () => wrap.remove();

        // Cho phép bắt sau một chút, để không chặn cú bấm tiếp theo vào nút
        setTimeout(() => wrap.classList.add("catchable"), 500);
        wrap.addEventListener("pointerdown", (e) => catchAnimal(e, wrap, inner, anim, emoji));
      }

      // Vài con trong bầy cất tiếng kêu
      const unique = [...new Set(herd)].slice(0, 3);
      unique.forEach((a, i) => playAnimal(a, i * 0.25));
    }

    // ---------- Bắt thú ----------
    function catchAnimal(e, wrap, inner, anim, emoji) {
      if (wrap.dataset.caught) return;
      wrap.dataset.caught = "1";
      wrap.classList.remove("catchable");
      anim.pause();

      const rare = rareAnimals.includes(emoji);
      const gained = rare ? 5 : 1;
      score += gained;
      if (score > best) {
        best = score;
        save("best", best);
      }
      renderScore();

      playAnimal(emoji);
      playCatch(rare);

      const pts = document.createElement("div");
      pts.className = "points" + (rare ? " rare" : "");
      pts.textContent = "+" + gained;
      pts.style.left = e.clientX + "px";
      pts.style.top = e.clientY + "px";
      document.body.appendChild(pts);
      pts.addEventListener("animationend", () => pts.remove());

      inner.animate(
        [{ transform: "scale(1)", opacity: 1 }, { transform: "scale(1.8)", opacity: 0 }],
        { duration: 300, easing: "ease-out", fill: "forwards" }
      ).onfinish = () => wrap.remove();
    }

    function renderScore() {
      scoreEl.textContent = `🎯 Điểm: ${score} · 🏆 Kỷ lục: ${best}`;
      scoreEl.classList.remove("bump");
      void scoreEl.offsetWidth;
      scoreEl.classList.add("bump");
    }

    // ---------- Bảng đổi màu nền ----------
    const backgrounds = [
      "#fde2e4", "#fff1c1", "#d8f3dc", "#cde7ff",
      "#e9d5ff", "#ffd6a5", "#1f2937",
      "linear-gradient(135deg, #f093fb, #f5576c)",
      "linear-gradient(135deg, #4facfe, #00f2fe)",
      "linear-gradient(135deg, #43e97b, #38f9d7)",
      "linear-gradient(135deg, #fa709a, #fee140)"
    ];

    function setBackground(value) {
      document.body.style.background = value;
      save("bg", value);
    }

    const resetSwatch = document.createElement("button");
    resetSwatch.className = "swatch default";
    resetSwatch.title = "Màu mặc định";
    resetSwatch.textContent = "↺";
    resetSwatch.addEventListener("click", () => setBackground(""));
    palette.appendChild(resetSwatch);

    backgrounds.forEach((bg) => {
      const s = document.createElement("button");
      s.className = "swatch";
      s.style.background = bg;
      s.addEventListener("click", () => setBackground(bg));
      palette.appendChild(s);
    });

    const picker = document.createElement("input");
    picker.type = "color";
    picker.title = "Tự chọn màu";
    picker.addEventListener("input", () => setBackground(picker.value));
    palette.appendChild(picker);

    paletteBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      palette.classList.toggle("open");
    });
    palette.addEventListener("click", (e) => e.stopPropagation());
    document.addEventListener("click", () => palette.classList.remove("open"));

    // ---------- Sáng / tối ----------
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
    }
    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      save("theme", next);
    });

    // ---------- Khôi phục lựa chọn lần trước ----------
    applyTheme(load("theme", "light"));
    const savedBg = load("bg", "");
    if (savedBg) document.body.style.background = savedBg;
    updateSoundBtn();
    scoreEl.textContent = `🎯 Điểm: 0 · 🏆 Kỷ lục: ${best}`;
  </script>
</body>
</html>
